[tool.ruff]
line-length = 80
exclude = ["build", "docs"]

[tool.ruff.lint]
# Equivalent to the old flake8 rules + isort (I = isort, E/W = pycodestyle, F = pyflakes)
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# Matches the old isort settings
force-wrap-aliases = false
combine-as-imports = false

[tool.pylint.master]
ignore = "build,docs"
fail-under = 9.93

[tool.pylint.format]
max-line-length = 80
